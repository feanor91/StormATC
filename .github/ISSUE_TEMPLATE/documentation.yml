name: Documentation improvement
description: Report unclear, missing, or incorrect project documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link the file or name the screen containing the text.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: A pull request is welcome if the correction is straightforward.
