name: Release validation

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-create-draft:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Check that the version goes up
        shell: pwsh
        run: |
          # Every release has a higher version than the one before it, and the tag says what the
          # source says: scripts/New-Release.ps1 makes both true.
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $source = (./scripts/Get-StormAtcVersion.ps1 | Select-Object -First 1)
          if ($tagVersion -ne $source) {
            throw "The tag $env:GITHUB_REF_NAME does not match the version in Directory.Build.props ($source). Use scripts/New-Release.ps1."
          }

          $current = [version]($tagVersion -replace "-.*$", "")
          $earlier = git tag --list "v*" |
            Where-Object { $_ -ne $env:GITHUB_REF_NAME } |
            ForEach-Object { $parsed = $null; if ([version]::TryParse(($_.TrimStart("v") -replace "-.*$", ""), [ref]$parsed)) { $parsed } } |
            Sort-Object -Descending |
            Select-Object -First 1
          if ($null -ne $earlier -and $current -le $earlier) {
            throw "The version $current is not higher than the earlier release $earlier."
          }

          Write-Host "Releasing $current (the highest earlier release is $earlier)."

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check repository for secrets
        shell: pwsh
        run: ./scripts/Test-RepositorySafety.ps1

      - name: Restore locked dependencies
        run: dotnet restore StormATC.sln --locked-mode --nologo

      - name: Build
        run: dotnet build StormATC.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test StormATC.sln -c Release --no-build --no-restore --nologo

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --draft `
              --verify-tag `
              --generate-notes `
              --title "StormATC $tag"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "The draft GitHub release could not be created."
          }
