name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check repository for secrets
        shell: pwsh
        run: ./scripts/Test-RepositorySafety.ps1

      - name: Restore locked dependencies
        run: dotnet restore StormATC.sln --locked-mode --nologo

      - name: Build
        run: dotnet build StormATC.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test StormATC.sln -c Release --no-build --no-restore --nologo

      - name: Restore Windows runtime dependencies
        run: >
          dotnet restore src/StormATC.Desktop/StormATC.Desktop.csproj
          -r win-x64 --locked-mode
          -p:NuGetLockFilePath=packages.win-x64.lock.json --nologo

      - name: Publish self-contained Windows build
        run: >
          dotnet publish src/StormATC.Desktop/StormATC.Desktop.csproj
          -c Release -r win-x64 --self-contained true --no-restore --nologo
          -p:ContinuousIntegrationBuild=true -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/StormATC-win-x64

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: StormATC-win-x64
          path: artifacts/StormATC-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = "StormATC-win-x64-latest.zip"
          Compress-Archive -Path artifacts/StormATC-win-x64/* -DestinationPath $zip -Force
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest $zip `
            --prerelease `
            --target $env:GITHUB_SHA `
            --title "StormATC latest build" `
            --notes "Automatic build of $($env:GITHUB_SHA.Substring(0,7)) from main. Built without the MSFS SDK: no SimConnect integration. For the full build, run scripts/New-StormATCInstaller.ps1 locally."
          if ($LASTEXITCODE -ne 0) { throw "The rolling release could not be created." }

      - name: List vulnerable dependencies
        run: dotnet list StormATC.sln package --vulnerable --include-transitive
