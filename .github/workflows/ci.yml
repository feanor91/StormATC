name: CI

on:
  # Every pushed branch is compiled and tested, so a feature branch is checked on Windows
  # (WPF included) before it is merged.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check repository for secrets
        shell: pwsh
        run: ./scripts/Test-RepositorySafety.ps1

      - name: Restore locked dependencies
        run: dotnet restore StormATC.sln --locked-mode --nologo

      - name: Build
        run: dotnet build StormATC.sln -c Release --no-restore --nologo

      - name: Test
        run: >-
          dotnet test StormATC.sln -c Release --no-build --no-restore --nologo
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Report failed tests
        if: ${{ failure() }}
        shell: pwsh
        run: |
          # Turn each failed test into an annotation, so failures are readable from the run
          # summary (and the API) without downloading the log or the trx artifact.
          Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $ns = New-Object Xml.XmlNamespaceManager($trx.NameTable)
            $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            foreach ($result in $trx.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $ns)) {
              $node = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $ns)
              $message = if ($node) { $node.InnerText } else { 'No message.' }
              $message = ($message -replace '\r?\n', ' ').Trim()
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) + '...' }
              $message = $message -replace '%', '%25'
              $title = "Test failed $($result.testName)" -replace '%', '%25' -replace ',', '%2C' -replace ':', '%3A'
              Write-Output "::error title=$title::$message"
            }
          }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore Windows runtime dependencies
        run: >
          dotnet restore src/StormATC.Desktop/StormATC.Desktop.csproj
          -r win-x64 --locked-mode
          -p:NuGetLockFilePath=packages.win-x64.lock.json --nologo

      - name: Build the MSFS toolbar panel package
        shell: pwsh
        run: ./scripts/Build-MsfsPanel.ps1

      - name: Publish self-contained Windows build
        run: >
          dotnet publish src/StormATC.Desktop/StormATC.Desktop.csproj
          -c Release -r win-x64 --self-contained true --no-restore --nologo
          -p:ContinuousIntegrationBuild=true -p:DebugSymbols=false -p:DebugType=None
          -o artifacts/StormATC-win-x64

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: StormATC-win-x64
          path: artifacts/StormATC-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/radio-francaise-voix-locale')
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -eq "main") { "latest" } else { "dev-latest" }
          $zip = "StormATC-win-x64-$tag.zip"
          Compress-Archive -Path artifacts/StormATC-win-x64/* -DestinationPath $zip -Force
          gh release delete $tag --cleanup-tag --yes 2>$null
          gh release create $tag $zip `
            --prerelease `
            --target $env:GITHUB_SHA `
            --title "StormATC $tag build ($($env:GITHUB_REF_NAME))" `
            --notes "Automatic build of $($env:GITHUB_SHA.Substring(0,7)) from $($env:GITHUB_REF_NAME). Built without the MSFS SDK: no SimConnect integration. For the full build, run scripts/New-StormATCInstaller.ps1 locally."
          if ($LASTEXITCODE -ne 0) { throw "The rolling release could not be created." }

      - name: List vulnerable dependencies
        run: dotnet list StormATC.sln package --vulnerable --include-transitive
